<!-- ■ MODULE: pages/reports ─ Central de Relatórios: relatórios padrão agrupados, modelos criados no Construtor (Configurações) e atalhos para os relatórios que já existem nas telas -->
<style data-module="pages/reports-css">
.rpt-wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
.rpt-side{position:sticky;top:8px;max-height:calc(100vh - 120px);overflow:auto;padding:4px 2px}
.rpt-side details{border:1px solid var(--b1);border-radius:var(--r10);background:var(--s1);margin-bottom:8px}
.rpt-side summary{cursor:pointer;padding:8px 12px;font-size:12px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.04em}
.rpt-item{display:block;width:100%;text-align:left;border:none;background:transparent;color:var(--t1);font-size:12.5px;padding:7px 12px;cursor:pointer;border-top:1px solid var(--b1);border-left:3px solid transparent}
.rpt-item:hover{background:var(--s2)}
.rpt-item.on{background:var(--s2);border-left-color:var(--acc);color:var(--acc);font-weight:600}
.rpt-item .set-sub{display:block;font-size:11px;color:var(--t3);font-weight:400}
.rpt-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.rpt-ctl label{font-size:11.5px;color:var(--t2);display:block;margin-bottom:3px}
.rpt-tot td{font-weight:700;border-top:2px solid var(--b2)}
.rpt-bld{display:grid;gap:12px}
.rpt-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.rpt-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--b2);border-radius:20px;padding:2px 4px 2px 10px;font-size:12px;background:var(--s2)}
.rpt-chip button{border:none;background:transparent;color:var(--t2);cursor:pointer;padding:2px 4px;font-size:12px}
@media(max-width:860px){.rpt-wrap{grid-template-columns:1fr}.rpt-side{position:static;max-height:none}}
</style>
<section class="page" id="p-reports" data-module="pages/reports">
  <div class="pg-hdr">
    <div><div class="pg-title">Relatórios<span class="help-q" data-help="Aqui ficam os relatórios padrão do sistema, agrupados por assunto, e os modelos que o administrador monta no Construtor de Relatórios (Configurações). Escolha um, informe o período quando houver e gere; exporte em Excel, CSV ou PDF. Cada pessoa só vê os campos que o perfil dela permite. Os relatórios que já existem nas telas continuam lá e também aparecem em &quot;Já nas telas&quot;." onclick="event.stopPropagation();HelpTip.toggle(this)">?</span></div><div class="pg-sub">Escolha o relatório, o período e gere. Exporte em Excel, CSV ou PDF.</div></div>
    <div class="btn-row"><button class="btn btn-sm" data-perm="settings" onclick="Reports.openBuilder()"><i class="ti ti-tools"></i>Construtor de Relatórios</button></div>
  </div>
  <div class="rpt-wrap">
    <nav class="rpt-side" id="rpt-list" aria-label="Lista de relatórios"></nav>
    <div>
      <div class="card" id="rpt-ctl"></div>
      <div id="rpt-out" style="margin-top:12px"></div>
    </div>
  </div>
</section>
